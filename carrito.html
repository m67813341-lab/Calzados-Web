<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<title>Carrito | Alma Boho</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.logo {
    text-align: center;
    line-height: 1;
}

.alma {
    font-family: "Allura", cursive;
    font-size: 85px;
    line-height: 0.8;
    margin-bottom: 12px;
}

.boho {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 8px;
    margin-left: 8px;
}

header p {
    margin-top: 8px;
    color: #ccc;
}

/* =========================
   NAVEGACIÓN
========================= */

nav {
    background: white;
    padding: 15px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    color: #222;
    text-decoration: none;
    font-weight: bold;
    margin: 0 10px;
}

.carrito-nav {
    display: inline-block;
    background: #111;
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
}

/* =========================
   CARRITO
========================= */

.carrito {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.titulo {
    text-align: center;
    margin-bottom: 30px;
}

.titulo h2 {
    font-size: 30px;
    margin-bottom: 8px;
}

.titulo p {
    color: #777;
}

/* =========================
   PRODUCTO DEL CARRITO
========================= */

.item-carrito {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.item-carrito img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    background: #f5f5f5;
    border-radius: 8px;
}

.item-info {
    flex: 1;
}

.item-info h3 {
    margin-bottom: 8px;
}

.item-info p {
    color: #666;
    font-size: 14px;
    margin-bottom: 5px;
}

.item-precio {
    font-size: 18px;
    font-weight: bold;
    margin-top: 8px;
}

.eliminar {
    border: none;
    background: #111;
    color: white;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.eliminar:hover {
    opacity: 0.8;
}

/* =========================
   TOTAL
========================= */

.resumen {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-top: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.total {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
}

.whatsapp {
    display: block;
    width: 100%;
    text-align: center;
    background: #111;
    color: white;
    padding: 14px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

.whatsapp:hover {
    opacity: 0.85;
}

.vaciar {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: white;
    color: #111;
    padding: 12px 20px;
    border: 2px solid #111;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.vaciar:hover {
    background: #111;
    color: white;
}

/* =========================
   CARRITO VACÍO
========================= */

.carrito-vacio {
    background: white;
    text-align: center;
    padding: 50px 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.carrito-vacio h3 {
    margin-bottom: 10px;
}

.carrito-vacio p {
    color: #777;
    margin-bottom: 25px;
}

.boton {
    display: inline-block;
    background: #111;
    color: white;
    padding: 13px 22px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px 20px;
    margin-top: 40px;
}

footer p {
    color: #aaa;
    margin-top: 15px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .item-carrito {
        align-items: flex-start;
    }

    .item-carrito img {
        width: 80px;
        height: 80px;
    }

    .item-info h3 {
        font-size: 16px;
    }

    .item-precio {
        font-size: 16px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">

    <div class="alma">
        Alma
    </div>

    <div class="boho">
        BOHO
    </div>

</div>

<p>
Zapatos • Sandalias • Botas
</p>

</header>


<nav>

<a href="index.html">
Inicio
</a>

<a href="catalogo.html">
🛍️ Catálogo
</a>

<a href="ofertas.html">
🔥 Ofertas
</a>

<a href="nuevo.html">
🆕 Nuevo catálogo
</a>

<a href="index.html#contacto">
Contacto
</a>

<a href="carrito.html" class="carrito-nav">
🛒 Carrito (<span id="cantidadCarrito">0</span>)
</a>

</nav>


<section class="carrito">

<div class="titulo">

<h2>
🛒 Tu carrito
</h2>

<p>
Revisá tus productos antes de realizar la consulta.
</p>

</div>


<div id="listaCarrito">

</div>


<div
class="resumen"
id="resumen"
style="display:none;"
>

<div class="total">

Total:
$<span id="totalCarrito">0</span>

</div>


<button
class="whatsapp"
onclick="enviarWhatsApp()"
>
💬 Consultar pedido por WhatsApp
</button>


<button
class="vaciar"
onclick="vaciarCarrito()"
>
🗑️ Vaciar carrito
</button>

</div>

</section>


<footer>

<h3>
ALMA BOHO
</h3>

<p>
© 2026 Alma Boho
</p>

</footer>


<script>

/* =========================
   OBTENER CARRITO
========================= */

function obtenerCarrito() {

    return JSON.parse(
        localStorage.getItem("carrito")
    ) || [];

}


/* =========================
   MOSTRAR CARRITO
========================= */

function mostrarCarrito() {

    const carrito =
        obtenerCarrito();


    const contenedor =
        document.getElementById(
            "listaCarrito"
        );


    const resumen =
        document.getElementById(
            "resumen"
        );


    const cantidad =
        document.getElementById(
            "cantidadCarrito"
        );


    cantidad.textContent =
        carrito.length;


    if (carrito.length === 0) {

        contenedor.innerHTML = `

            <div class="carrito-vacio">

                <h3>
                    Tu carrito está vacío 🛒
                </h3>

                <p>
                    Todavía no agregaste ningún producto.
                </p>

                <a
                    href="catalogo.html"
                    class="boton"
                >
                    🛍️ Ver catálogo
                </a>

            </div>

        `;


        resumen.style.display =
            "none";


        return;

    }


    contenedor.innerHTML = "";


    let total = 0;


    carrito.forEach(
        (producto, index) => {

            total +=
                Number(producto.precio);


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-carrito";


            item.innerHTML = `

                <img
                    src="${producto.foto}"
                    alt="${producto.nombre}"
                >


                <div class="item-info">

                    <h3>
                        ${producto.nombre}
                    </h3>

                    <p>
                        Color:
                        ${producto.color}
                    </p>

                    <div class="item-precio">

                        $${Number(
                            producto.precio
                        ).toLocaleString("es-AR")}

                    </div>

                </div>


                <button
                    class="eliminar"
                    onclick="eliminarProducto(${index})"
                >
                    ✕
                </button>

            `;


            contenedor.appendChild(
                item
            );

        }
    );


    document.getElementById(
        "totalCarrito"
    ).textContent =
        total.toLocaleString(
            "es-AR"
        );


    resumen.style.display =
        "block";

}


/* =========================
   ELIMINAR PRODUCTO
========================= */

function eliminarProducto(index) {

    const carrito =
        obtenerCarrito();


    carrito.splice(
        index,
        1
    );


    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );


    mostrarCarrito();

}


/* =========================
   VACIAR CARRITO
========================= */

function vaciarCarrito() {

    localStorage.removeItem(
        "carrito"
    );


    mostrarCarrito();

}


/* =========================
   WHATSAPP
========================= */

function enviarWhatsApp() {

    const carrito =
        obtenerCarrito();


    if (carrito.length === 0) {

        return;

    }


    let mensaje =
        "Hola, quiero consultar por este pedido:%0A%0A";


    carrito.forEach(
        (producto, index) => {

            mensaje +=
                `${index + 1}. ${producto.nombre} - Color: ${producto.color} - $${Number(producto.precio).toLocaleString("es-AR")}%0A`;

        }
    );


    let total = 0;


    carrito.forEach(
        producto => {

            total +=
                Number(producto.precio);

        }
    );


    mensaje +=
        `%0ATotal: $${total.toLocaleString("es-AR")}`;


    const whatsapp =
        "https://wa.me/5492226622331?text=" +
        mensaje;


    window.open(
        whatsapp,
        "_blank"
    );

}


/* =========================
   INICIAR
========================= */

mostrarCarrito();

</script>

</body>

  </html>
