<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<title>Producto | Alma Boho</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.logo {
    text-align: center;
    line-height: 1;
}

.alma {
    font-family: "Allura", cursive;
    font-size: 85px;
    line-height: 0.8;
    margin-bottom: 12px;
}

.boho {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 8px;
    margin-left: 8px;
}

header p {
    margin-top: 8px;
    color: #ccc;
}

/* =========================
   NAVEGACIÓN
========================= */

nav {
    background: white;
    padding: 15px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    color: #222;
    text-decoration: none;
    font-weight: bold;
    margin: 0 10px;
}

/* =========================
   PRODUCTO
========================= */

.producto-detalle {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.producto-contenido {
    background: white;
    border-radius: 15px;
    padding: 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.producto-imagen {
    width: 100%;
    height: 500px;
    object-fit: contain;
    background: #f5f5f5;
    border-radius: 12px;
}

.producto-info h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.codigo {
    color: #888;
    font-size: 14px;
    margin-bottom: 20px;
}

.precio {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.precio-anterior {
    text-decoration: line-through;
    color: #888;
    font-size: 18px;
    margin-right: 10px;
    font-weight: normal;
}

.dato {
    margin: 15px 0;
    font-size: 16px;
}

.talles {
    margin-top: 25px;
}

.talles h3 {
    margin-bottom: 12px;
}

.talle {
    display: inline-block;
    background: #111;
    color: white;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 7px;
    margin: 4px;
    font-weight: bold;
}

.talle:hover {
    opacity: 0.8;
}

.stock {
    margin-top: 20px;
    color: #666;
}

.whatsapp {
    display: inline-block;
    margin-top: 25px;
    background: #111;
    color: white;
    padding: 14px 22px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.volver {
    display: inline-block;
    margin-bottom: 20px;
    color: #222;
    text-decoration: none;
    font-weight: bold;
}

/* =========================
   ESTADOS
========================= */

.cargando {
    text-align: center;
    padding: 50px;
    color: #777;
}

.error {
    text-align: center;
    padding: 50px;
    color: #b00020;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px 20px;
    margin-top: 40px;
}

footer p {
    color: #aaa;
    margin-top: 15px;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    .producto-contenido {
        grid-template-columns: 1fr;
        padding: 18px;
    }

    .producto-imagen {
        height: 350px;
    }

    .producto-info h1 {
        font-size: 26px;
    }

    .precio {
        font-size: 26px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">

    <div class="alma">
        Alma
    </div>

    <div class="boho">
        BOHO
    </div>

</div>

<p>
Zapatos • Sandalias • Botas
</p>

</header>


<nav>

<a href="index.html">
Inicio
</a>

<a href="catalogo.html">
🛍️ Catálogo
</a>

<a href="ofertas.html">
🔥 Ofertas
</a>

<a href="nuevo.html">
🆕 Nuevo catálogo
</a>

<a href="index.html#contacto">
Contacto
</a>

</nav>


<section class="producto-detalle">

<a
href="catalogo.html"
class="volver"
>
← Volver al catálogo
</a>


<div
id="producto"
class="cargando"
>

Cargando producto...

</div>

</section>


<footer>

<h3>
ALMA BOHO
</h3>

<p>
© 2026 Alma Boho
</p>

</footer>


<script>

/* =========================
   OBTENER ID DEL PRODUCTO
========================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const id =
    parametros.get("id");


/* =========================
   CARGAR PRODUCTO
========================= */

async function cargarProducto() {

    const contenedor =
        document.getElementById("producto");


    if (!id) {

        contenedor.innerHTML = `

            <div class="error">

                No se encontró el producto.

            </div>

        `;

        return;

    }


    const { data, error } =
        await supabaseClient

        .from("Productos")

        .select("*")

        .eq("id", id)

        .single();


    if (error || !data) {

        console.error(
            "Error:",
            error
        );


        contenedor.innerHTML = `

            <div class="error">

                No se pudo encontrar
                este producto.

            </div>

        `;

        return;

    }


    const producto =
        data;


    /* =========================
       TALLES
    ========================= */

    const talles =
        producto.Talles || {};


    const listaTalles =
        Object.entries(talles);


    let botonesTalles = "";


    listaTalles.forEach(
        ([talle, cantidad]) => {

            if (Number(cantidad) > 0) {

                const mensaje =
                    `Hola, quiero consultar por el ${producto.Nombre} ${producto.Color}, talle ${talle}.`;


                const whatsapp =
                    "https://wa.me/5492226622331?text=" +
                    encodeURIComponent(
                        mensaje
                    );


                botonesTalles += `

                    <a
                        href="${whatsapp}"
                        target="_blank"
                        class="talle"
                    >
                        Talle ${talle}
                    </a>

                `;

            }

        }
    );


    /* =========================
       STOCK
    ========================= */

    const stockTexto =

        listaTalles

        .filter(
            ([talle, cantidad]) =>
            Number(cantidad) > 0
        )

        .map(
            ([talle, cantidad]) =>
            `${talle} (${cantidad})`
        )

        .join(" · ");


    /* =========================
       PRECIO
    ========================= */

    const precio =
        Number(producto.Precio)
        .toLocaleString("es-AR");


    const precioAnterior =

        producto.Oferta &&
        producto.PrecioAnterior

        ?

        `<span class="precio-anterior">
            $${Number(producto.PrecioAnterior).toLocaleString("es-AR")}
        </span>`

        :

        "";


    /* =========================
       MOSTRAR PRODUCTO
    ========================= */

    contenedor.className =
        "producto-contenido";


    contenedor.innerHTML = `

        <div>

            <img
                src="${producto.Foto}"
                alt="${producto.Nombre} ${producto.Color}"
                class="producto-imagen"
            >

        </div>


        <div class="producto-info">

            <h1>
                ${producto.Nombre}
            </h1>


            <div class="codigo">

                Código:
                ${producto.Codigo}

            </div>


            <div class="precio">

                ${precioAnterior}

                $${precio}

            </div>


            <div class="dato">

                <strong>
                    Color:
                </strong>

                ${producto.Color}

            </div>


            <div class="talles">

                <h3>
                    Talles disponibles
                </h3>

                ${botonesTalles || "Sin talles disponibles"}

            </div>


            <div class="stock">

                <strong>
                    Stock:
                </strong>

                ${stockTexto || "Sin stock"}

            </div>

<button
    class="agregar-carrito"
    onclick="agregarAlCarrito()"
>
    🛒 Agregar al carrito
</button>
            <a
                href="https://wa.me/5492226622331"
                target="_blank"
                class="whatsapp"
            >
                💬 Consultar por WhatsApp
            </a>

        </div>

    `;

}


/* =========================
   INICIAR
========================= */

cargarProducto();

</script>

</body>

  </html>
