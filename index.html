<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calzados ChrisVer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 7px;
            color: #ccc;
        }

        /* =========================
           MENÚ
        ========================= */

        nav {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-bottom: 1px solid #ddd;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        /* =========================
           PORTADA
        ========================= */

        .hero {
            background: white;
            text-align: center;
            padding: 65px 20px;
        }

        .hero h2 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #666;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            background: #111;
            color: white;
            padding: 13px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .boton:hover {
            opacity: 0.85;
        }

        /* =========================
           CATEGORÍAS
        ========================= */

        .categorias {
            padding: 30px 18px 10px;
            max-width: 1100px;
            margin: auto;
            text-align: center;
        }

        .categorias h2 {
            margin-bottom: 20px;
        }

        .botones-categoria {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .categoria {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .categoria:hover {
            background: #eee;
        }

        /* =========================
           CATÁLOGO
        ========================= */

        .catalogo {
            max-width: 1100px;
            margin: auto;
            padding: 40px 18px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #777;
        }

        /* =========================
           PRODUCTOS
        ========================= */

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 20px;
        }

        .producto {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .producto img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #ddd;
        }

        .producto-info {
            padding: 16px;
        }

        .producto h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .precio {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .datos {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .stock {
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .disponible {
            color: #333;
        }
