<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administración - Calzados ChrisVer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: 20px;
}

.contenedor {
    max-width: 900px;
    margin: auto;
}

header {
    background: #111;
    color: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    margin-bottom: 8px;
}

.login,
.panel {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    margin-bottom: 12px;
    font-size: 16px;
}

button {
    border: none;
    background: #111;
    color: white;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

#mensaje {
    margin-top: 12px;
    color: #b00020;
}

.producto {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.producto h3 {
    margin-bottom: 7px;
}

.producto p {
    color: #666;
    margin: 4px 0;
}

.oculto {
    display: none;
}

.salir {
    background: #777;
    margin-bottom: 20px;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>CALZADOS CHRISVER</h1>

<p>Panel de administración</p>

</header>


<!-- LOGIN -->

<div class="login" id="login">

<h2>Iniciar sesión</h2>

<input
    type="email"
    id="email"
    placeholder="Correo electrónico"
>

<input
    type="password"
    id="password"
    placeholder="Contraseña"
>

<button onclick="iniciarSesion()">
    INGRESAR
</button>

<div id="mensaje"></div>

</div>


<!-- PANEL -->

<div class="panel oculto" id="panel">

<button
    class="salir"
    onclick="cerrarSesion()"
>
    CERRAR SESIÓN
</button>

<h2>Productos</h2>

<div id="lista">
    Cargando productos...
</div>

</div>

</div>


<script>

/* =========================
   UID DEL ADMINISTRADOR
========================= */

const ADMIN_UID =
"b7235c04-d740-4171-afe1-cc71308bcc05";


/* =========================
   INICIAR SESIÓN
========================= */

async function iniciarSesion() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const mensaje =
        document.getElementById("mensaje");


    mensaje.textContent = "Ingresando...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

        });


    if (error) {

        mensaje.textContent =
            "Correo o contraseña incorrectos.";

        console.error(error);

        return;

    }


    if (!data.user || data.user.id !== ADMIN_UID) {

        await supabaseClient.auth.signOut();

        mensaje.textContent =
            "Este usuario no tiene permisos de administrador.";

        return;

    }


    mensaje.textContent = "";

    document
        .getElementById("login")
        .classList.add("oculto");


    document
        .getElementById("panel")
        .classList.remove("oculto");


    cargarProductos();

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    document
        .getElementById("panel")
        .classList.add("oculto");


    document
        .getElementById("login")
        .classList.remove("oculto");

}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

    const lista =
        document.getElementById("lista");


    const { data, error } =
        await supabaseClient

        .from("Productos")

        .select("*")

        .order("id", {
            ascending: true
        });


    if (error) {

        lista.innerHTML =
            "No se pudieron cargar los productos.";

        console.error(error);

        return;

    }


    if (!data || data.length === 0) {

        lista.innerHTML =
            "No hay productos.";

        return;

    }


    lista.innerHTML = "";


    data.forEach(producto => {

        const talles =
            JSON.stringify(producto.Talles);


        const elemento =
            document.createElement("div");


        elemento.className =
            "producto";


        elemento.innerHTML = `

            <h3>
                ${producto.Nombre}
            </h3>

            <p>
                Código: ${producto.Codigo}
            </p>

            <p>
                Color: ${producto.Color}
            </p>

            <p>
                Precio: $${producto.Precio}
            </p>

            <p>
                Talles: ${talles}
            </p>

        `;


        lista.appendChild(elemento);

    });

}

</script>

</body>

</html>
